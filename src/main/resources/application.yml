spring:
  application:
    name: talented-financial-rag

  datasource:
    url: jdbc:h2:mem:ragdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  cache:
    type: simple  # Switch to redis in production

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Milvus vector database
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: financial_documents
  username: ${MILVUS_USERNAME:}
  password: ${MILVUS_PASSWORD:}

# Ollama local LLM
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  llm-model: ${LLM_MODEL:qwen2.5:72b}
  small-model: ${SMALL_MODEL:qwen2.5:14b}
  embedding-model: ${EMBEDDING_MODEL:bge-m3}

# Reranker service (BGE-Reranker)
reranker:
  base-url: ${RERANKER_URL:http://localhost:8001}
  model: bge-reranker-v2-m3
  enabled: ${RERANKER_ENABLED:true}

# Retrieval pipeline parameters
retrieval:
  vector-top-k: 50
  bm25-top-k: 30
  rerank-top-k: 5
  max-retries: 2
  quality-threshold: 0.7
  min-results: 1
  vector-weight: 0.6
  bm25-weight: 0.4

# Document chunking
chunking:
  chunk-size: 800
  overlap-ratio: 0.15

# Actuator & monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    com.financial.rag: DEBUG
    dev.langchain4j: INFO
    io.milvus: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/${PG_DB:ragdb}
    username: ${PG_USER:raguser}
    password: ${PG_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate

  cache:
    type: redis
